rules:
  - id: feedgo-python-dynamic-eval
    message: Dynamic eval/exec is forbidden in FeedGo runtime code.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: feedgo-python-shell-true
    message: subprocess shell=True requires explicit security review.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  - id: feedgo-python-pickle-load
    message: Deserializing pickle data is unsafe for untrusted input.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  - id: feedgo-javascript-dynamic-code
    message: Dynamic JavaScript execution is forbidden.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
